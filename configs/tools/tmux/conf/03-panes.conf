##
## === PANE MANAGEMENT
##

unbind '"'
unbind %
bind -N "Split pane horizontally" | split-window -h -c "#{pane_current_path}"
bind -N "Split pane vertically" - split-window -v -c "#{pane_current_path}"
bind -N "Resize pane left" -r h resize-pane -L 2
bind -N "Resize pane right" -r l resize-pane -R 2
bind -N "Resize pane up" -r k resize-pane -U 1
bind -N "Resize pane down" -r j resize-pane -D 1
bind -N "Clear terminal and scrollback" K \
    send-keys "reset && clear" C-m \; \
    clear-history \; \
    display-message "Cleared terminal buffer."

## .