##
## ==== PREFIX & KEYBINDINGS
##

## custom prefix
unbind C-b
set -g prefix `
bind -N "Send literal backtick" ` send-prefix
## fast reload of full tmux config
bind -N "Reload tmux config" r send-keys C-c \; \
    source-file ~/.config/tmux/tmux.conf \; \
    display-message "Reloaded: ~/.config/tmux/tmux.conf"
## start window/pane numbering at 1
set -g base-index 1
set -g pane-base-index 1

##
## ==== COPY MODE & KEYBINDINGS
##

## use vi-style keys in copy-mode
setw -g mode-keys vi
## quick interactive forward-search
bind -N "Search pane content" f command-prompt -p "Search:" "copy-mode \; send -X search-forward '%%'"
## enter/operate in copy-mode
bind-key -N "Enter copy mode" v copy-mode
bind-key -N "Begin selection" -T copy-mode-vi v send -X begin-selection
bind-key -N "Copy selection" -T copy-mode-vi y send -X copy-selection

##
## ==== WINDOW & SESSION MANAGEMENT
##

## remove potential defaults
unbind p
unbind c
## window navigation
bind -N "Next window" n next-window
bind -N "Previous window" N previous-window
## rename window/session
bind -N "Rename window" R command-prompt "rename-window %%"
bind -N "Rename session" S command-prompt "rename-session %%"
## create window/session
bind -N "New window in current path" C-n new-window -c "#{pane_current_path}"
bind -N "New or attach session by name" C-s command-prompt -p "New session name:" "new-session -As '%%'"
## keep window indexes contiguous after closing a window
set-option -g renumber-windows on
## safety prompts for destructive actions
bind -N "Kill window (confirm)" W confirm-before -p "Kill window #{window_index}? (y/n)" kill-window
bind -N "Kill session (confirm)" X confirm-before -p "Kill session #{session_name}? (y/n)" kill-session

##
## ==== SCROLL REFINEMENTS
## : mouse + keyboard scroll behaviour in copy-mode and from normal mode

## fine-grained mouse wheel scrolling in copy-mode (1 line per tick)
bind-key -N "Wheel up: 1 line" -T copy-mode-vi WheelUpPane   send -N 1 -X scroll-up
bind-key -N "Wheel down: 1 line" -T copy-mode-vi WheelDownPane send -N 1 -X scroll-down

## from normal mode: first wheel action enters copy-mode, then scrolls 1 line
bind-key -N "Wheel up: enter copy-mode, 1 line" -n WheelUpPane if-shell -F "#{pane_in_mode}" \
    "send -N 1 -X scroll-up" \
    "copy-mode -e; send -N 1 -X scroll-up"
bind-key -N "Wheel down: 1 line" -n WheelDownPane if-shell -F "#{pane_in_mode}" \
    "send -N 1 -X scroll-down" \
    "send -N 1 -X scroll-down"

## keyboard micro-scroll in copy-mode
bind-key -N "Ctrl+y: scroll up 1 line" -T copy-mode-vi C-y send -N 1 -X scroll-up
bind-key -N "Ctrl+e: scroll down 1 line" -T copy-mode-vi C-e send -N 1 -X scroll-down

##
## ---- BIGGER STEPS WITH MODIFIERS (MOUSE)
##

## shift + wheel = 2 lines per tick
## ctrl  + wheel = 5 lines per tick
## alt   + wheel = full page up / down
bind-key -N "Shift+wheel up: 2 lines" -T copy-mode-vi S-WheelUpPane   send -N 2 -X scroll-up
bind-key -N "Shift+wheel down: 2 lines" -T copy-mode-vi S-WheelDownPane send -N 2 -X scroll-down
bind-key -N "Ctrl+wheel up: 5 lines" -T copy-mode-vi C-WheelUpPane   send -N 5 -X scroll-up
bind-key -N "Ctrl+wheel down: 5 lines" -T copy-mode-vi C-WheelDownPane send -N 5 -X scroll-down
bind-key -N "Alt+wheel up: page up" -T copy-mode-vi M-WheelUpPane   send -X page-up
bind-key -N "Alt+wheel down: page down" -T copy-mode-vi M-WheelDownPane send -X page-down

## from normal mode: modifier+wheel auto-enters copy-mode, then applies the big step
bind-key -N "Shift+wheel up: enter copy-mode, 5 lines" -n S-WheelUpPane if-shell -F "#{pane_in_mode}" \
    "send -N 5 -X scroll-up" \
    "copy-mode -e; send -N 5 -X scroll-up"
bind-key -N "Shift+wheel down: enter copy-mode, 5 lines" -n S-WheelDownPane if-shell -F "#{pane_in_mode}" \
    "send -N 5 -X scroll-down" \
    "copy-mode -e; send -N 5 -X scroll-down"

bind-key -N "Ctrl+wheel up: enter copy-mode, 20 lines" -n C-WheelUpPane if-shell -F "#{pane_in_mode}" \
    "send -N 20 -X scroll-up" \
    "copy-mode -e; send -N 20 -X scroll-up"
bind-key -N "Ctrl+wheel down: enter copy-mode, 20 lines" -n C-WheelDownPane if-shell -F "#{pane_in_mode}" \
    "send -N 20 -X scroll-down" \
    "copy-mode -e; send -N 20 -X scroll-down"

bind-key -N "Alt+wheel up: enter copy-mode, page up" -n M-WheelUpPane if-shell -F "#{pane_in_mode}" \
    "send -X page-up" \
    "copy-mode -e; send -X page-up"
bind-key -N "Alt+wheel down: enter copy-mode, page down" -n M-WheelDownPane if-shell -F "#{pane_in_mode}" \
    "send -X page-down" \
    "copy-mode -e; send -X page-down"

##
## ---- BIGGER STEPS WITH KEYBOARD (NO MOUSE)
##

## 2-line nudges
bind-key -N "Ctrl+k: scroll up 2 lines" -T copy-mode-vi C-k send -N 2  -X scroll-up
bind-key -N "Ctrl+j: scroll down 2 lines" -T copy-mode-vi C-j send -N 2  -X scroll-down

## 20-line nudges
bind-key -N "Ctrl+u: scroll up 5 lines" -T copy-mode-vi C-u send -N 5 -X scroll-up
bind-key -N "Ctrl+d: scroll down 5 lines" -T copy-mode-vi C-d send -N 5 -X scroll-down

## native page keys
bind-key -N "Page up" -T copy-mode-vi PageUp   send -X page-up
bind-key -N "Page down" -T copy-mode-vi PageDown send -X page-down

## .
